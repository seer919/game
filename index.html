<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>화려한 횡스크롤 RPG 완성본</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background-color: #1a1a1a; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            font-family: 'Malgun Gothic', sans-serif; 
            color: white; 
            overflow: hidden;
        }
        .ui-container {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 16px;
            background: rgba(0,0,0,0.7);
            padding: 12px 25px;
            border-radius: 8px;
            border: 1px solid #444;
        }
        .hp-bar-bg {
            width: 150px;
            height: 20px;
            background-color: #555;
            border-radius: 5px;
            display: inline-block;
            vertical-align: middle;
            overflow: hidden;
            margin-left: 5px;
        }
        .hp-bar-fill {
            width: 100%;
            height: 100%;
            background-color: #e74c3c;
            transition: width 0.1s ease;
        }
        canvas { 
            background: #1e272e; 
            border: 4px solid #fff; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
        }
        .controls {
            margin-top: 15px;
            color: #aaa;
            font-size: 14px;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="ui-container">
    <div>체력: <div class="hp-bar-bg"><div id="hp-fill" class="hp-bar-fill"></div></div> <span id="hp-txt">100/100</span></div>
    <div>레벨: <span id="lvl" style="color:#f1c40f">1</span></div>
    <div>경험치: <span id="exp">0</span>/100</div>
    <div>골드: <span id="gold" style="color:#f39c12">0</span> G</div>
</div>

<canvas id="gameCanvas" width="800" height="450"></canvas>

<div class="controls">
    <strong>[A, D / 좌우 방향키]</strong> 이동 | <strong>[W]</strong> 점프 | <strong>[K]</strong> 공격<br>
    <span style="color:#5dade2">🌟 발판 조작 가능! 공중 발판 아래에서 W를 누르면 위로 통과하여 밟고 올라설 수 있습니다.</span>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// 🌍 글로벌 게임 설정
const GRAVITY = 0.6;
const GROUND_Y = 380;
const MAP_WIDTH = 3000; 

const keys = {};
let cameraX = 0;
const damageTexts = []; 
const particles = []; // 이펙트 파티클 배열

// 🧱 공중 발판 데이터 (x, y, 가로폭, 세로두께)
const platforms = [
    { x: 300, y: 270, width: 160, height: 15 },
    { x: 550, y: 190, width: 200, height: 15 },
    { x: 900, y: 260, width: 150, height: 15 },
    { x: 1300, y: 200, width: 220, height: 15 },
    { x: 1700, y: 270, width: 180, height: 15 },
    { x: 2200, y: 180, width: 250, height: 15 }
];

// ✨ 파티클(사방으로 튀는 불꽃) 클래스
class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 4 + 2; 
        this.vx = (Math.random() - 0.5) * 7; 
        this.vy = (Math.random() - 0.5) * 7 - 2; 
        this.color = color;
        this.alpha = 1;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.1; // 파티클 중력
        this.alpha -= 0.025; 
    }
    draw() {
        ctx.save();
        ctx.translate(-cameraX, 0);
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

function createExplosion(x, y, color, count = 12) {
    for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color));
    }
}

// 🧑 1. 플레이어 클래스
class Player {
    constructor() {
        this.x = 100;
        this.y = 200;
        this.width = 45;
        this.height = 65;
        this.vx = 0;
        this.vy = 0;
        this.speed = 5;
        this.jumpPower = -13;
        this.isGrounded = false;
        
        this.isAttacking = false;
        this.attackCooldown = 0;
        this.direction = "right"; 
        this.invincibleFrames = 0;
        
        // 스탯
        this.maxHp = 100;
        this.hp = 100;
        this.level = 1;
        this.exp = 0;
        this.gold = 0;
        this.attackPower = 25;
    }

    update() {
        if (this.invincibleFrames > 0) this.invincibleFrames--;

        // 좌우 이동 (피격 중이 아닐 때)
        if (this.invincibleFrames < 20) { 
            if (keys['KeyA'] || keys['ArrowLeft']) {
                this.vx = -this.speed;
                this.direction = "left";
            } else if (keys['KeyD'] || keys['ArrowRight']) {
                this.vx = this.speed;
                this.direction = "right";
            } else {
                this.vx = 0;
            }
        }

        // 🌟 점프 조작을 'KeyW'로 변경
        if (keys['KeyW'] && this.isGrounded && this.invincibleFrames < 20) {
            this.vy = this.jumpPower;
            this.isGrounded = false;
        }

        // 공격 조작 (K)
        if (keys['KeyK'] && this.attackCooldown === 0) {
            this.isAttacking = true;
            this.attackCooldown = 25; 
            createExplosion(this.x + (this.direction === 'right' ? this.width + 10 : -10), this.y + this.height/2, "#f39c12", 4);
        }

        if (this.attackCooldown > 0) {
            this.attackCooldown--;
            if (this.attackCooldown < 12) this.isAttacking = false; 
        }

        // 물리 연산
        this.vy += GRAVITY;
        this.x += this.vx;
        this.y += this.vy;

        // 기본 땅 착지 검사
        this.isGrounded = false; 
        if (this.y + this.height >= GROUND_Y) {
            this.y = GROUND_Y - this.height;
            this.vy = 0;
            this.isGrounded = true;
        }

        // 🧱 공중 발판 착지 시스템 (위에서 아래로 내려올 때만 걸치게 설정)
        platforms.forEach(p => {
            if (this.x + this.width > p.x && this.x < p.x + p.width) {
                if (this.y + this.height >= p.y && this.y + this.height - this.vy <= p.y + 12 && this.vy >= 0) {
                    this.y = p.y - this.height;
                    this.vy = 0;
                    this.isGrounded = true;
                }
            }
        });

        // 맵 이탈 방지
        if (this.x < 0) this.x = 0;
        if (this.x + this.width > MAP_WIDTH) this.x = MAP_WIDTH - this.width;

        // 카메라 가로 추적
        if (this.x > 400 && this.x < MAP_WIDTH - 400) {
            cameraX = this.x - 400;
        } else if (this.x <= 400) {
            cameraX = 0;
        } else if (this.x >= MAP_WIDTH - 400) {
            cameraX = MAP_WIDTH - 800;
        }
    }

    draw() {
        if (this.invincibleFrames > 0 && Math.floor(this.invincibleFrames / 3) % 2 === 0) return;

        ctx.save();
        ctx.translate(-cameraX, 0);

        // 🌈 고급 그래픽: 네온 그림자 + 그라데이션 적용
        ctx.shadowBlur = 15;
        ctx.shadowColor = "#3498db";

        let gradient = ctx.createLinearGradient(this.x, this.y, this.x, this.y + this.height);
        gradient.addColorStop(0, "#5dade2"); 
        gradient.addColorStop(1, "#2471a3"); 
        ctx.fillStyle = gradient;
        
        ctx.beginPath();
        ctx.roundRect(this.x, this.y, this.width, this.height, 8); 
        ctx.fill();

        // 캐릭터 눈
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#ffffff";
        let eyeX = this.direction === "right" ? this.x + this.width - 15 : this.x + 5;
        ctx.fillRect(eyeX, this.y + 15, 10, 10);

        // ⚔️ 그라데이션 공격 검기 효과
        if (this.isAttacking) {
            let atkGrad = ctx.createLinearGradient(this.x, this.y, this.x + (this.direction === "right" ? 100 : -100), this.y);
            atkGrad.addColorStop(0, "rgba(231, 76, 60, 0.8)");
            atkGrad.addColorStop(1, "rgba(231, 76, 60, 0)"); 

            ctx.fillStyle = atkGrad;
            if (this.direction === "right") {
                ctx.fillRect(this.x + this.width, this.y + 10, 70, 45);
            } else {
                ctx.fillRect(this.x - 70, this.y + 10, 70, 45);
            }
        }

        ctx.restore();
    }

    takeDamage(amount, monsterX) {
        if (this.invincibleFrames > 0) return; 

        this.hp -= amount;
        if (this.hp < 0) this.hp = 0;
        
        this.invincibleFrames = 30; 
        this.vy = -6; 
        this.vx = this.x < monsterX ? -7 : 7; 

        createExplosion(this.x + this.width/2, this.y + this.height/2, "#e74c3c", 8);
        updateUI();

        if (this.hp <= 0) {
            alert("게임 오버! 처음부터 재시작합니다.");
            this.hp = this.maxHp;
            this.x = 100;
            this.y = 200;
            this.gold = 0;
            this.exp = 0;
            updateUI();
        }
    }

    gainExp(amount) {
        this.exp += amount;
        if (this.exp >= 100) {
            this.level++;
            this.exp -= 100;
            this.maxHp += 20;
            this.hp = this.maxHp;
            this.attackPower += 6;
            createDamageText("LEVEL UP!", this.x + this.width/2, this.y - 20, "#f1c40f");
            createExplosion(this.x + this.width/2, this.y + this.height/2, "#f1c40f", 25);
        }
        updateUI();
    }
}

// 🐛 2. 몬스터 클래스
class Monster {
    constructor(x, y, type = 'normal') {
        this.x = x;
        this.y = y - 50;
        this.width = 45;
        this.height = 50;
        this.alive = true;
        this.vx = type === 'boss' ? -1 : -1.8; 
        this.maxHp = type === 'boss' ? 160 : 50;
        this.hp = this.maxHp;
        this.type = type;
        this.startX = x; 
    }

    update() {
        if (!this.alive) return;

        this.x += this.vx;
        // 패트롤 범위 제어
        let range = this.type === 'boss' ? 80 : 150;
        if (Math.abs(this.x - this.startX) > range) {
            this.vx = -this.vx;
        }
    }

    draw() {
        if (!this.alive) return;

        ctx.save();
        ctx.translate(-cameraX, 0);

        ctx.shadowBlur = 10;
        ctx.shadowColor = this.type === 'boss' ? "#9b59b6" : "#2ecc71";

        // 그라데이션 색상 배치
        let mGrad = ctx.createLinearGradient(this.x, this.y, this.x, this.y + this.height);
        if (this.type === 'boss') {
            mGrad.addColorStop(0, "#af7ac5"); mGrad.addColorStop(1, "#76448a");
        } else {
            mGrad.addColorStop(0, "#58d68d"); mGrad.addColorStop(1, "#1d8348");
        }
        ctx.fillStyle = mGrad;

        ctx.beginPath();
        ctx.roundRect(this.x, this.y, this.width, this.height, 6);
        ctx.fill();

        // 몬스터 개별 체력바 체감
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#444";
        ctx.fillRect(this.x, this.y - 12, this.width, 6);
        ctx.fillStyle = "#e74c3c";
        ctx.fillRect(this.x, this.y - 12, this.width * (this.hp / this.maxHp), 6);

        ctx.restore();
    }

    takeDamage(amount) {
        this.hp -= amount;
        createDamageText(`-${amount}`, this.x + this.width / 2, this.y - 10, this.type === 'boss' ? "#ffeb3b" : "#ff7675");
        
        // 💥 타격 입었을 때 파티클 폭발 이펙트 발생
        createExplosion(this.x + this.width/2, this.y + this.height/2, this.type === 'boss' ? "#9b59b6" : "#2ecc71", 15);

        if (this.hp <= 0) {
            this.alive = false;
            let expReward = this.type === 'boss' ? 100 : 35;
            let goldReward = this.type === 'boss' ? 120 : 20;
            
            player.gainExp(expReward);
            player.gold += goldReward;
            updateUI();

            setTimeout(() => {
                this.alive = true;
                this.hp = this.maxHp;
                this.x = this.startX;
            }, 4000);
        }
    }
}

// ✍️ 3. 데미지 텍스트 클래스
class DamageText {
    constructor(text, x, y, color) {
        this.text = text;
        this.x = x;
        this.y = y;
        this.color = color;
        this.alpha = 1;
        this.vy = -1.5; 
    }
    update() {
        this.y += this.vy;
        this.alpha -= 0.02; 
    }
    draw() {
        ctx.save();
        ctx.translate(-cameraX, 0);
        ctx.globalAlpha = this.alpha;
        ctx.font = "bold 18px sans-serif";
        ctx.fillStyle = this.color;
        ctx.textAlign = "center";
        ctx.fillText(this.text, this.x, this.y);
        ctx.restore();
    }
}

function createDamageText(text, x, y, color) {
    damageTexts.push(new DamageText(text, x, y, color));
}

// ⚙️ 4. 데이터 초기 생성 및 이벤트 결합
const player = new Player();
const monsters = [
    new Monster(650, GROUND_Y),
    new Monster(1100, GROUND_Y),
    new Monster(1550, GROUND_Y),
    new Monster(2000, GROUND_Y),
    new Monster(2650, GROUND_Y, 'boss') 
];

function updateUI() {
    document.getElementById("lvl").innerText = player.level;
    document.getElementById("exp").innerText = player.exp;
    document.getElementById("gold").innerText = player.gold;
    document.getElementById("hp-txt").innerText = `${player.hp}/${player.maxHp}`;
    document.getElementById("hp-fill").style.width = (player.hp / player.maxHp) * 100 + "%";
}

window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

function isColliding(rect1, rect2) {
    return rect1.x < rect2.x + rect2.width &&
           rect1.x + rect1.width > rect2.x &&
           rect1.y < rect2.y + rect2.height &&
           rect1.y + rect1.height > rect2.y;
}

// 🔄 5. 메인 루프 게임엔진
function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // [배경 드로잉] 입체 풍경선 (원경 패럴랙스 스크롤)
    ctx.save();
    ctx.translate(-cameraX * 0.25, 0); 
    ctx.strokeStyle = "#2c3e50";
    ctx.lineWidth = 3;
    for(let i=0; i<MAP_WIDTH; i+=250) {
        ctx.strokeRect(i, 180, 120, 200);
    }
    ctx.restore();

    // [공중 발판 그리기]
    ctx.save();
    ctx.translate(-cameraX, 0);
    ctx.fillStyle = "#e67e22"; 
    ctx.shadowBlur = 8;
    ctx.shadowColor = "#e67e22";
    platforms.forEach(p => {
        ctx.beginPath();
        ctx.roundRect(p.x, p.y, p.width, p.height, 4);
        ctx.fill();
    });
    ctx.restore();

    // [바닥 지형 그리기]
    ctx.save();
    ctx.translate(-cameraX, 0);
    ctx.shadowBlur = 10;
    ctx.shadowColor = "#7f8c8d";
    ctx.fillStyle = "#5d6d7e";
    ctx.fillRect(0, GROUND_Y, MAP_WIDTH, canvas.height - GROUND_Y);
    ctx.fillStyle = "#2ecc71"; // 상단 잔디 띠 이펙트
    ctx.fillRect(0, GROUND_Y, MAP_WIDTH, 6);
    ctx.restore();

    // [엔티티 제어 업데이트]
    player.update();
    monsters.forEach(m => m.update());

    // [실시간 전투/피격 충돌 시스템 검사]
    monsters.forEach(monster => {
        if (!monster.alive) return;

        if (player.isAttacking) {
            let attackRange = {
                x: player.direction === "right" ? player.x + player.width : player.x - 70,
                y: player.y + 10,
                width: 70,
                height: 45
            };
            if (isColliding(attackRange, monster)) {
                monster.takeDamage(player.attackPower);
                player.isAttacking = false; 
            }
        }

        if (isColliding(player, monster)) {
            player.takeDamage(12, monster.x); 
        }
    });

    // [드로잉 및 잔여 이펙트 제거 루프]
    player.draw();
    monsters.forEach(m => m.draw());

    // 파티클 처리
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].alpha <= 0) particles.splice(i, 1);
    }

    // 데미지 텍스트 처리
    for (let i = damageTexts.length - 1; i >= 0; i--) {
        damageTexts[i].update();
        damageTexts[i].draw();
        if (damageTexts[i].alpha <= 0) damageTexts.splice(i, 1);
    }

    requestAnimationFrame(gameLoop);
}

// 최초 작동
updateUI();
gameLoop();
</script>

</body>
</html>
